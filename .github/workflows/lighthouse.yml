name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [develop, main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # Audit the production robots.txt; preview builds block crawling on purpose.
          SITE_ENV: production

      - name: Start server
        run: |
          cd apps/web/dist/client
          python3 -m http.server 8080 &
          sleep 3

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:8080/
            http://localhost:8080/services
            http://localhost:8080/fil/services/health
            http://localhost:8080/contact
            http://localhost:8080/government
          configPath: .lighthouserc.json
          uploadArtifacts: true
